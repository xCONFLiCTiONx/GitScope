name: Update About Section
on:
  push:
    branches:
      - main # Change to 'master' if your default branch uses that name
    paths:
      - '.github/workflows/update-about.yml' # Only runs when you change this file

jobs:
  update-sidebar:
    runs-on: ubuntu-latest
    permissions:
      repository-projects: write
      contents: read
    steps:
      - name: Update GitHub About Sidebar
        run: |
          gh repo edit ${{ github.repository }} \
            --description "GitScope is a high-performance, local-first Git management suite designed for professional developers handling complex, multi-repository workspaces. **Note: This application is specifically optimized and designed for Windows.**" \
            --homepage "https://xconflictionx.cc/" \
            --add-topic "automation,github-actions,git"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
